  <path class="logo-thin" d="M 248 186 C 259 179, 271 178, 282 181" />

  <!-- Typography -->
  <text x="250" y="415" class="logo-text-main">LUMIÈRE</text>
  <text x="250" y="445" class="logo-text-sub">HAUTE BEAUTÉ</text>
</svg>
