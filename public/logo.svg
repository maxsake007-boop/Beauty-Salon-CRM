<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .logo-line {
        fill: none;
        stroke: #9d5a44;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .logo-thin {
        fill: none;
        stroke: #9d5a44;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .logo-text-main {
        font-family: 'Playfair Display', 'Cormorant Garamond', 'Cinzel', Didot, 'Bodoni MT', Georgia, serif;
        font-size: 40px;
        font-weight: 500;
        letter-spacing: 0.3em;
        fill: #272c30;
        text-anchor: middle;
      }
      .logo-text-sub {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.52em;
        fill: #5a5450;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Arched Frame -->
  <path
